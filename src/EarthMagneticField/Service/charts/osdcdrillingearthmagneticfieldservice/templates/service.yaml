apiVersion: v1
kind: Service
metadata:
  name: {{ include "earthmagneticfieldservice.fullname" . }}
  labels: {{- include "earthmagneticfieldservice.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "earthmagneticfieldservice.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
